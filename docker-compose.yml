services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root}
      MYSQL_DATABASE: vivere_sgc
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - dbdata:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASS:-root}"], interval: 5s, retries: 20 }
  web:
    build: .
    ports: ["8080:80"]
    depends_on: { db: { condition: service_healthy } }
    environment:
      DB_HOST: db
      DB_NAME: vivere_sgc
      DB_USER: root
      DB_PASS: ${DB_ROOT_PASS:-root}
      SEED_DEMO: ${SEED_DEMO:-1}
      APP_DEBUG: ${APP_DEBUG:-0}
    volumes:
      - ./storage:/var/www/html/storage
volumes:
  dbdata:
